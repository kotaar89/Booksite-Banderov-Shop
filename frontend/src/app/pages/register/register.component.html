<div class="auth-page container">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="auth-title">Создание аккаунта</h1>
      <p class="auth-subtitle">Присоединяйтесь к книжному клубу «БукРид»</p>
    </div>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="regName">Ваше имя *</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-user"></i>
          <input id="regName" type="text" [(ngModel)]="name" name="name" required class="form-input" placeholder="Иван Иванов" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Электронная почта *</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope"></i>
          <input id="regEmail" type="email" [(ngModel)]="email" name="email" required class="form-input" placeholder="mail@example.com" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regPass">Пароль *</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input id="regPass" type="password" [(ngModel)]="password" name="password" required class="form-input" placeholder="Минимум 6 симв." />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirm">Повтор пароля *</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-shield"></i>
            <input id="regConfirm" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required class="form-input" placeholder="Повторите" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPhone">Номер телефона</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-phone"></i>
          <input id="regPhone" type="tel" [(ngModel)]="phone" name="phone" class="form-input" placeholder="+7 (999) 000-00-00" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regAddress">Адрес доставки (необязательно)</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-location-dot"></i>
          <input id="regAddress" type="text" [(ngModel)]="address" name="address" class="form-input" placeholder="г. Москва, ул. Ленина, д. 1" />
        </div>
      </div>

      @if (errorMessage) {
        <div class="auth-error">
          <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-lg auth-submit-btn">
        @if (isLoading) {
          <i class="fa-solid fa-spinner fa-spin"></i> Регистрация...
        } @else {
          Зарегистрироваться
        }
      </button>
    </form>

    <div class="auth-footer">
      <span>Уже есть профиль?</span>
      <a routerLink="/login" class="auth-link">Войти в аккаунт</a>
    </div>
  </div>
</div>
